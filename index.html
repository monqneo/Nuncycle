<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NUNCYCLE - Eco Metaverse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-green: #10b981;
        --neon-lime: #84cc16;
        --neon-cyan: #06b6d4;
        --deep-forest: #022c22;
      }
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #020617;
        color: #e2e8f0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden; /* Prevent horizontal scroll only */
        overflow-y: auto;   /* Allow vertical scroll */
      }
      h1, h2, h3, .font-tech {
        font-family: 'Orbitron', sans-serif;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* ORGANIC LIQUID GLASS STYLES */
      .liquid-card {
        background: rgba(2, 44, 34, 0.4); /* Deep forest tint */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        border: 1px solid rgba(16, 185, 129, 0.2); /* Emerald border */
        border-top: 1px solid rgba(132, 204, 22, 0.3); /* Lime highlight top */
        box-shadow: 
          0 4px 24px -1px rgba(0, 0, 0, 0.3),
          inset 0 0 30px rgba(16, 185, 129, 0.05);
        position: relative;
        overflow: hidden;
      }
      
      .liquid-card::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 50%;
        background: linear-gradient(180deg, rgba(132, 204, 22, 0.05) 0%, rgba(255,255,255,0) 100%);
        pointer-events: none;
        border-radius: 24px 24px 0 0;
      }

      .liquid-button {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(6, 78, 59, 0.3) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-top: 1px solid rgba(132, 204, 22, 0.4);
        box-shadow: 
          0 4px 15px rgba(0,0,0,0.3), 
          inset 0 2px 10px rgba(16, 185, 129, 0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      
      .liquid-button:active {
        transform: scale(0.96);
      }

      /* Shimmer effect for buttons */
      .liquid-button::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: 0.5s;
      }
      .liquid-button:hover::before {
        left: 100%;
      }

      /* ORGANIC SHAPES & ANIMATIONS */
      .organic-border {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }

      @keyframes grow-pulse {
        0% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.05); filter: brightness(1.2); }
        100% { transform: scale(1); filter: brightness(1); }
      }
      .animate-grow {
        animation: grow-pulse 3s ease-in-out infinite;
      }

      @keyframes float-leaf {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(-100px) rotate(45deg); opacity: 0; }
      }
      .animate-leaf {
        animation: float-leaf 8s linear infinite;
      }

      @keyframes fruit-drop {
        0% { transform: translateY(0) scale(0); opacity: 0; }
        20% { transform: translateY(-10px) scale(1.2); opacity: 1; }
        50% { transform: translateY(0px) scale(1); opacity: 1; }
        100% { transform: translateY(30px) scale(0.8); opacity: 0; }
      }
      .animate-fruit-drop {
        animation: fruit-drop 1.5s ease-out forwards;
      }

      @keyframes tree-pop {
        0% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.15); filter: brightness(1.5) drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        100% { transform: scale(1); filter: brightness(1); }
      }
      .animate-tree-pop {
        animation: tree-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes selected-glow {
        0% { filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.5)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.9)); transform: scale(1.1); }
        100% { filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.5)); transform: scale(1); }
      }
      .animate-selected-glow {
        animation: selected-glow 2s infinite ease-in-out;
      }

      /* Custom Scroll */
      .custom-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: rgba(0,0,0,0);
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: rgba(16, 185, 129, 0.3);
        border-radius: 10px;
      }
    </style>

{

</head>

</html>
